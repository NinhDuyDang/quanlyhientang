<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/main-layout :: layout(~{:: .patient-create-block}, 'Nhập ca bệnh', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/patient.css}">
    </th:block>
</head>
<body>

<div class="patient-create-block">
    <div class="mb-3 mt-2">
        <a th:href="@{/patient}" class="text-decoration-none text-muted d-inline-flex align-items-center gap-1" style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <div class="card form-container-card">
        <form th:action="@{/patient/create}" th:object="${request}" method="POST">
            <div class="row g-4">

                <div class="col-md-6">
                    <label class="form-label fw-bold">Mã ca bệnh</label>
                    <input type="text"
                           class="form-control bg-light"
                           value="Hệ thống tự động tạo mã"
                           readonly
                           disabled>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Tên bệnh nhân <span style="color: red;">*</span></label>
                    <input type="text" name="patientName" class="form-control form-control-custom" placeholder="Nhập họ tên bệnh nhân" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Bệnh viện <span style="color: red;">*</span></label>
                    <select name="hospitalId" class="form-select form-control-custom" required>
                        <option value="" disabled selected hidden>Chọn bệnh viện</option>
                        <option th:each="h : ${hospitals}" th:value="${h.id}" th:text="${h.name}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Năm sinh <span style="color: red;">*</span></label>
                    <input type="number" name="birthYear" class="form-control form-control-custom" placeholder="Ví dụ: 1990" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom d-block">Giới tính </label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="MALE" checked>
                            <label class="form-check-label" for="male">Nam</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="FEMALE">
                            <label class="form-check-label" for="female">Nữ</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Nguyên nhân <span style="color: red;">*</span></label>
                    <select name="cause" class="form-select form-control-custom" required>
                        <option value="TRAFFIC_ACCIDENT">Tai nạn giao thông</option>
                        <option value="STROKE">Đột quỵ</option>
                        <option value="BRAIN_INJURY">Chấn thương sọ não</option>
                        <option value="OTHER">Khác</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom d-block">Trạng thái <span style="color: red;">*</span></label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="st1" value="BRAIN_DEATH_1" checked>
                            <label class="form-check-label" for="st1">Chết não lần 1 </label>
                        </div>
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="st2" value="BRAIN_DEATH_2">
                            <label class="form-check-label" for="st2">Chết não lần 2</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="st3" value="BRAIN_DEATH_3">
                            <label class="form-check-label" for="st3">Chết não lần 3</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Khả năng hiến <span style="color: red;">*</span></label>
                    <select name="donorStatus" class="form-select form-control-custom" required>
                        <option value="POTENTIAL">Có khả năng</option>
                        <option value="FAMILY_ACCEPTED">Gia đình đồng ý</option>
                        <option value="FAMILY_REJECTED">Gia đình từ chối</option>
                        <option value="PENDING">Đang chờ</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Ngày ghi nhận <span style="color: red;">*</span></label>
                    <input type="date" name="incidentDate" class="form-control form-control-custom" required>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom">Ghi chú</label>
                    <textarea name="note" class="form-control form-control-custom" rows="3" placeholder="Nhập ghi chú..."></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-start gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2">Lưu ca bệnh</button>
                <a th:href="@{/patient}" class="btn btn-light border px-4 py-2">Hủy</a>
            </div>
        </form>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const roleSelect = document.getElementById('roleSelect');
        const hospitalField = document.getElementById('hospitalField');
        const hospitalSelect = hospitalField.querySelector('select');

        function toggleHospitalField() {
            // Nếu chọn ADMIN, ẩn trường và bỏ chọn giá trị
            if (roleSelect.value === 'ADMIN') {
                hospitalField.style.display = 'none';
                hospitalSelect.value = "";
            } else {
                // Nếu chọn STAFF, hiển thị trường
                hospitalField.style.display = 'block';
            }
        }

        // Lắng nghe sự kiện thay đổi
        roleSelect.addEventListener('change', toggleHospitalField);

        // Chạy hàm ngay khi tải trang để xử lý trường hợp khi chỉnh sửa
        toggleHospitalField();
    });
</script>
</body>
</html>
