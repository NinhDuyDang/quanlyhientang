<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)"
      th:replace="~{fragments/main-layout :: layout(~{:: .patient-create-block}, 'Nhập ca bệnh', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/patient.css}">
    </th:block>
</head>
<body>

<div class="patient-create-block">
    <div class="mb-3 mt-2">
        <a th:href="@{/patient}" class="text-decoration-none text-muted d-inline-flex align-items-center gap-1" style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <div class="card form-container-card">
        <form th:action="@{/patient}" method="GET">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Mã ca bệnh *</label>
                    <input type="text" class="form-control form-control-custom" placeholder="Ví dụ: CA2024060005" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Bệnh viện *</label>
                    <select class="form-select form-control-custom" required>
                        <option value="" disabled selected hidden>Chọn bệnh viện</option>
                        <option>Bệnh viện Bạch Mai</option>
                        <option>Bệnh viện Chợ Rẫy</option>
                        <option>Bệnh viện Việt Đức</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Tuổi/Năm sinh *</label>
                    <input type="number" class="form-control form-control-custom" placeholder="Nhập số tuổi" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom d-block">Giới tính *</label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="Nam" checked>
                            <label class="form-check-label" for="male">Nam</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="Nữ">
                            <label class="form-check-label" for="female">Nữ</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Nguyên nhân *</label>
                    <select class="form-select form-control-custom" required>
                        <option value="">Tai nạn</option>
                        <option>Đột quỵ</option>
                        <option>Khác</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom d-block">Trạng thái *</label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="st1" value="Nguy cơ" checked>
                            <label class="form-check-label" for="st1">Nguy cơ chết não</label>
                        </div>
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="st2" value="Xác nhận">
                            <label class="form-check-label" for="st2">Xác nhận chết não</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="st3" value="Không đủ">
                            <label class="form-check-label" for="st3">Không đủ điều kiện</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Khả năng hiến *</label>
                    <select class="form-select form-control-custom" required>
                        <option>Có khả năng hiến</option>
                        <option>Không</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom">Ghi chú</label>
                    <textarea class="form-control form-control-custom" rows="3" placeholder="Nhập ghi chú theo dõi bệnh nhân..."></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-start gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2">Lưu</button>
                <a th:href="@{/patient}" class="btn btn-light border px-4 py-2">Hủy</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
