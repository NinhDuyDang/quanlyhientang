<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/main-layout :: layout(~{:: .patient-edit-block}, 'Chỉnh sửa ca bệnh', ~{:: .page-css}, ~{})}">

<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/patient.css}">
    </th:block>
</head>

<body>

<div class="patient-edit-block">
    <div class="mb-3 mt-2">
        <a th:href="@{/patient}" class="text-decoration-none text-muted d-inline-flex align-items-center gap-1"
           style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <div class="card form-container-card">
        <form th:action="@{/patient/edit/{id}(id=${patient.id})}" method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Mã ca bệnh</label>
                    <input type="text" name="caseCode" class="form-control form-control-custom bg-light"
                           th:value="${patient.caseCode}" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Tên bệnh nhân *</label>
                    <input type="text" name="patientName" class="form-control form-control-custom"
                           th:value="${patient.patientName}" placeholder="Nhập tên bệnh nhân" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Bệnh viện *</label>
                    <select name="hospitalId" class="form-select form-control-custom" required>
                        <option th:each="h : ${hospitals}" th:value="${h.id}" th:text="${h.name}"
                                th:selected="${patient.hospital != null && h.id == patient.hospital.id}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Năm sinh *</label>
                    <input type="number" name="birthYear" class="form-control form-control-custom"
                           th:value="${patient.birthYear}" min="1900" max="2026" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom d-block">Giới tính</label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="gender" id="edit-male" value="MALE"
                                   th:checked="${patient.gender != null && patient.gender.name() == 'MALE'}">
                            <label class="form-check-label" for="edit-male">Nam</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="edit-female"
                                   value="FEMALE"
                                   th:checked="${patient.gender != null && patient.gender.name() == 'FEMALE'}">
                            <label class="form-check-label" for="edit-female">Nữ</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Nguyên nhân *</label>
                    <select name="cause" class="form-select form-control-custom" required>
                        <option value="TRAFFIC_ACCIDENT"
                                th:selected="${patient.cause != null && patient.cause.name() == 'TRAFFIC_ACCIDENT'}">Tai
                            nạn giao thông</option>
                        <option value="STROKE"
                                th:selected="${patient.cause != null && patient.cause.name() == 'STROKE'}">Đột quỵ
                        </option>
                        <option value="BRAIN_INJURY"
                                th:selected="${patient.cause != null && patient.cause.name() == 'BRAIN_INJURY'}">Chấn
                            thương sọ não</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom d-block">Trạng thái *</label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="st1"
                                   value="BRAIN_DEATH_1"
                                   th:checked="${patient.status != null && patient.status.name() == 'BRAIN_DEATH_1'}"
                                   required>
                            <label class="form-check-label" for="st1">Chết não lần 1</label>
                        </div>
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="st2"
                                   value="BRAIN_DEATH_2"
                                   th:checked="${patient.status != null && patient.status.name() == 'BRAIN_DEATH_2'}"
                                   required>
                            <label class="form-check-label" for="st2">Chết não lần 2</label>
                        </div>
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="st3"
                                   value="BRAIN_DEATH_3"
                                   th:checked="${patient.status != null && patient.status.name() == 'BRAIN_DEATH_3'}"
                                   required>
                            <label class="form-check-label" for="st3">Chết não lần 3</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Khả năng hiến *</label>
                    <select name="donorStatus" class="form-select form-control-custom" required>
                        <option value="POTENTIAL"
                                th:selected="${patient.donorStatus != null && patient.donorStatus.name() == 'POTENTIAL'}">
                            Có khả năng</option>
                        <option value="FAMILY_ACCEPTED"
                                th:selected="${patient.donorStatus != null && patient.donorStatus.name() == 'FAMILY_ACCEPTED'}">
                            Gia đình đồng ý</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom">Ghi chú</label>
                    <textarea name="note" class="form-control form-control-custom" rows="3"
                              th:text="${patient.note}"></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-start gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2">Cập nhật</button>
                <a th:href="@{/patient}" class="btn btn-light border px-4 py-2">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>

</html>
