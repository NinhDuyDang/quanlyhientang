<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)"
      th:replace="~{fragments/main-layout :: layout(~{:: .patient-edit-block}, 'Chỉnh sửa ca bệnh', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/patient.css}">
    </th:block>
</head>
<body>

<div class="patient-edit-block">
    <div class="mb-3 mt-2">
        <a th:href="@{/patient}" class="text-decoration-none text-muted d-inline-flex align-items-center gap-1" style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <div class="card form-container-card">
        <form th:action="@{/patient}" method="GET">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Mã ca bệnh (Đọc hiểu)</label>
                    <input type="text" class="form-control form-control-custom bg-light" th:value="${patient.maCaBenh}" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Bệnh viện *</label>
                    <select class="form-select form-control-custom" required>
                        <option th:selected="${patient.benhVien == 'Bệnh viện Bạch Mai'}">Bệnh viện Bạch Mai</option>
                        <option th:selected="${patient.benhVien == 'Bệnh viện Chợ Rẫy'}">Bệnh viện Chợ Rẫy</option>
                        <option th:selected="${patient.benhVien == 'Bệnh viện Việt Đức'}">Bệnh viện Việt Đức</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Tuổi/Năm sinh *</label>
                    <input type="number" class="form-control form-control-custom" th:value="${patient.tuoi}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom d-block">Giới tính *</label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="gender" id="edit-male" value="Nam" th:checked="${patient.gioiTinh == 'Nam'}">
                            <label class="form-check-label" for="edit-male">Nam</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="edit-female" value="Nữ" th:checked="${patient.gioiTinh == 'Nữ'}">
                            <label class="form-check-label" for="edit-female">Nữ</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Nguyên nhân *</label>
                    <select class="form-select form-control-custom" required>
                        <option th:selected="${patient.nguyenNhan == 'Tai nạn'}">Tai nạn</option>
                        <option th:selected="${patient.nguyenNhan == 'Đột quỵ'}">Đột quỵ</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom d-block">Trạng thái *</label>
                    <div class="mt-2">
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="est1" value="Nguy cơ" th:checked="${patient.trangThai == 'Nguy cơ chết não'}">
                            <label class="form-check-label" for="est1">Nguy cơ chết não</label>
                        </div>
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input" type="radio" name="status" id="est2" value="Xác nhận" th:checked="${patient.trangThai == 'Xác nhận chết não'}">
                            <label class="form-check-label" for="est2">Xác nhận chết não</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="est3" value="Không đủ" th:checked="${patient.trangThai == 'Không đủ điều kiện'}">
                            <label class="form-check-label" for="est3">Không đủ điều kiện</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Khả năng hiến *</label>
                    <select class="form-select form-control-custom" required>
                        <option th:selected="${patient.khaNangHien == 'Có khả năng hiến'}">Có khả năng hiến</option>
                        <option th:selected="${patient.khaNangHien == 'Không'}">Không</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label form-label-custom">Ghi chú</label>
                    <textarea class="form-control form-control-custom" rows="3" th:text="${patient.ghiChu}"></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-start gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2">Cập nhật</button>
                <a th:href="@{/patient}" class="btn btn-light border px-4 py-2">Hủy</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
