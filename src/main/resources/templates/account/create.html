<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/main-layout :: layout(~{:: .account-create-block}, 'Thêm tài khoản mới', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/account.css}">
    </th:block>
</head>
<body>

<div class="account-create-block">
    <div class="mb-3 mt-2">
        <a th:href="@{/account}" class="text-decoration-none text-muted d-inline-flex align-items-center gap-1" style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <div class="card form-container-card">
        <form th:action="@{/account/create}" method="POST" th:object="${userRequest}" id="createAccountForm">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{username}" name="username" class="form-control form-control-custom" placeholder="Nhập tên đăng nhập" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Mật khẩu ban đầu <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{password}" name="password" class="form-control form-control-custom" placeholder="Nhập mật khẩu" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Vai trò hệ thống <span class="text-danger">*</span></label>
                    <select th:field="*{role}" id="roleSelect" name="role" class="form-select form-control-custom" required>
                        <option value="ADMIN">ADMIN - Ban quản trị trung tâm</option>
                        <option value="STAFF">STAFF - Điều phối viên bệnh viện</option>
                    </select>
                </div>

                <div class="col-md-6" id="hospitalField">
                    <label class="form-label form-label-custom">Bệnh viện liên kết</label>
                    <select th:field="*{hospitalId}" id="hospitalSelect" name="hospitalId" class="form-select form-control-custom">
                        <option value="">-- Chọn bệnh viện ( nếu là Staff ) --</option>
                        <option th:each="h : ${hospitals}" th:value="${h.id}" th:text="${h.name}">Bệnh viện</option>
                    </select>
                    <div id="hospitalError" class="invalid-feedback" style="display: none;">
                        Vui lòng chọn bệnh viện cho nhân viên!
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
                <a th:href="@{/account}" class="btn btn-light border px-4 py-2" style="font-size: 14px; border-radius: 6px;">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4 py-2" style="font-size: 14px; border-radius: 6px; background-color: #0d6efd; border: none;">
                    <i class="bi bi-check-lg me-1"></i> Lưu thông tin
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('createAccountForm');
        const roleSelect = document.getElementById('roleSelect');
        const hospitalSelect = document.getElementById('hospitalSelect');
        const hospitalError = document.getElementById('hospitalError');
        const hospitalField = document.getElementById('hospitalField');

        // Logic chặn submit nếu là STAFF mà chưa chọn bệnh viện
        form.addEventListener('submit', function (event) {
            if (roleSelect.value === 'STAFF') {
                if (!hospitalSelect.value || hospitalSelect.value === "") {
                    event.preventDefault();
                    hospitalSelect.classList.add('is-invalid');
                    hospitalError.style.display = 'block';
                    return false;
                }
            }
        });

        // Xóa báo lỗi khi chọn lại
        hospitalSelect.addEventListener('change', function () {
            if (this.value) {
                this.classList.remove('is-invalid');
                hospitalError.style.display = 'none';
            }
        });

        // Toggle ẩn hiện bệnh viện
        roleSelect.addEventListener('change', function() {
            if (this.value === 'ADMIN') {
                hospitalField.style.display = 'none';
                hospitalSelect.value = "";
                hospitalSelect.classList.remove('is-invalid');
                hospitalError.style.display = 'none';
            } else {
                hospitalField.style.display = 'block';
            }
        });

        // Chạy khởi tạo trạng thái ban đầu
        if (roleSelect.value === 'ADMIN') {
            hospitalField.style.display = 'none';
        }
    });
</script>

</body>
</html>
