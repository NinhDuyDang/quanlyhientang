<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/main-layout :: layout(~{:: .account-create-block}, 'Thêm tài khoản mới', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/account.css}">
    </th:block>
</head>
<body>

<div class="account-create-block">
    <div class="mb-3 mt-2">
        <a th:href="@{/account}" class="text-decoration-none text-muted d-inline-flex align-items-center gap-1" style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <div class="card form-container-card">
        <form th:action="@{/account}" method="GET">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-custom" placeholder="Nhập tên đăng nhập duy nhất" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Mật khẩu ban đầu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control form-control-custom" placeholder="Nhập mật khẩu tài khoản" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Vai trò hệ thống <span class="text-danger">*</span></label>
                    <select class="form-select form-control-custom" required>
                        <option value="ADMIN">ADMIN - Ban quản trị trung tâm</option>
                        <option value="HOSPITAL">HOSPITAL - Điều phối viên bệnh viện</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Bệnh viện liên kết</label>
                    <select class="form-select form-control-custom">
                        <option value="">-- Tài khoản tự do (Admin Trung tâm) --</option>
                        <option>Bệnh viện Bạch Mai</option>
                        <option>Bệnh viện Chợ Rẫy</option>
                        <option>Bệnh viện Việt Đức</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
                <a th:href="@{/account}" class="btn btn-light border px-4 py-2" style="font-size: 14px; border-radius: 6px;">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4 py-2" style="font-size: 14px; border-radius: 6px; background-color: #0d6efd; border: none;">
                    <i class="bi bi-check-lg me-1"></i> Lưu thông tin
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
