<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/main-layout :: layout(~{:: .account-content-block}, 'Quản lý tài khoản', ~{:: .page-css}, ~{:: .page-script})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/account.css}">
    </th:block>
</head>
<body>

<div class="account-content-block">
    <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

        <a sec:authorize="hasAuthority('ROLE_ADMIN')"
           th:href="@{/account/create}"
           class="btn btn-primary d-flex align-items-center gap-2 text-white text-decoration-none"
           style="padding: 8px 16px; font-weight: 500; border-radius: 6px; font-size: 14px; background-color: #0d6efd; border: none;">
            <i class="bi bi-plus-lg"></i> Thêm tài khoản
        </a>

    </div>

    <div class="card card-table-container overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom-style align-middle mb-0">
                <thead>
                <tr>
                    <th style="width: 5%;">ID</th>
                    <th style="width: 20%;">Tên đăng nhập</th>
                    <th style="width: 15%;">Vai trò</th>
                    <th style="width: 25%;">Thuộc đơn vị</th>
                    <th style="width: 15%;">Ngày tạo</th>
                    <th style="width: 10%;">Trạng thái</th>
                    <th class="text-end" style="width: 10%; padding-right: 24px !important;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td class="text-secondary"
                        th:text="${#strings.substring(u.id, 0, 8) + '...'}"
                        th:title="${u.id}"
                        style="cursor: help;">
                    </td>

                    <td class="text-username-custom"
                        th:text="${u.username}">
                        admin
                    </td>

                    <td>
                        <span class="badge-role"
                              th:classappend="${u.role != null && u.role.name() == 'ADMIN' ? 'role-admin' : 'role-hospital'}"
                              th:text="${u.role != null ? u.role.name() : 'N/A'}">
                        </span>
                    </td>

                    <td class="text-secondary"
                        th:text="${u.hospital != null ? u.hospital.name : 'Chưa phân bổ'}">
                    </td>

                    <td class="text-muted"
                        th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}">
                    </td>

                    <td>
                        <label class="form-switch-custom">
                            <input type="checkbox"
                                   th:checked="${u.enabled}"
                                   th:data-id="${u.id}"
                                   onclick="changeUserStatus(this)">
                            <span class="slider-toggle"></span>
                        </label>
                    </td>

                    <td class="text-end" style="padding-right: 24px !important;">
                        <div class="d-flex justify-content-end gap-2">

                            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
                               th:href="@{/account/edit/{id}(id=${u.id})}"
                               class="btn-square-edit"
                               title="Sửa">
                                <i class="bi bi-pencil-fill"></i>
                            </a>

                            <button sec:authorize="hasAuthority('ROLE_ADMIN')"
                                    type="button"
                                    class="btn-square-delete"
                                    title="Xóa"
                                    th:data-url="@{/account/delete/{id}(id=${u.id})}">
                                <i class="bi bi-trash-fill"></i>
                            </button>

                        </div>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Xác nhận xóa</h5>
                </div>

                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa tài khoản này không?
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Hủy bỏ
                    </button>

                    <form id="deleteForm" method="POST">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <button type="submit"
                                class="btn btn-danger">
                            Xác nhận xóa
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<th:block class="page-script">
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            document.querySelector('.account-content-block')
                .addEventListener('click', function(e) {

                    const btn = e.target.closest('.btn-square-delete');

                    if (btn) {
                        const url = btn.getAttribute('data-url');
                        const modalEl = document.getElementById('deleteModal');
                        const form = document.getElementById('deleteForm');

                        if (form && modalEl) {
                            form.action = url;
                            new bootstrap.Modal(modalEl).show();
                        }
                    }
                });
        });
    </script>
</th:block>

</body>
</html>
