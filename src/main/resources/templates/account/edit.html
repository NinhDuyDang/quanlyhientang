<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/main-layout :: layout(~{:: .account-edit-block}, 'Chỉnh sửa tài khoản', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/account.css}">
    </th:block>
</head>
<body>

<div class="account-edit-block">
    <div class="mb-3 mt-2">
        <a th:href="@{/account}" class="text-decoration-none text-muted d-inline-flex align-items-center gap-1" style="font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <div class="card form-container-card">
        <form th:action="@{/account}" method="GET">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label form-label-custom">Tên đăng nhập (Khóa chính)</label>
                    <input type="text" class="form-control form-control-custom bg-light" th:value="${user.username}" readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Mật khẩu mới</label>
                    <input type="password" class="form-control form-control-custom" th:value="${user.password}" placeholder="Nhập mật khẩu mới">
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Vai trò hệ thống *</label>
                    <select class="form-select form-control-custom" required>
                        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN - Ban quản trị trung tâm</option>
                        <option value="HOSPITAL" th:selected="${user.role == 'HOSPITAL'}">HOSPITAL - Điều phối viên bệnh viện</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label form-label-custom">Bệnh viện liên kết</label>
                    <select class="form-select form-control-custom">
                        <option value="" th:selected="${user.hospitalName == null}">-- Không trực thuộc --</option>
                        <option th:selected="${user.hospitalName == 'Bệnh viện Bạch Mai'}">Bệnh viện Bạch Mai</option>
                        <option th:selected="${user.hospitalName == 'Bệnh viện Chợ Rẫy'}">Bệnh viện Chợ Rẫy</option>
                        <option th:selected="${user.hospitalName == 'Bệnh viện Việt Đức'}">Bệnh viện Việt Đức</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
                <a th:href="@{/account}" class="btn btn-light border px-4 py-2" style="font-size: 14px; border-radius: 6px;">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4 py-2" style="font-size: 14px; border-radius: 6px; background-color: #0d6efd; border: none;">
                    <i class="bi bi-save me-1"></i> Cập nhật thay đổi
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
