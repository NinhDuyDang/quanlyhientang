<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:fragment="layout(content, title, specific_head, specific_js)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} + ' - Hệ thống quản lý'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <th:block th:replace="${specific_head}"></th:block>
</head>
<body>
<div class="wrapper" style="display: flex; min-height: 100vh;">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="content" style="flex: 1; display: flex; flex-direction: column; padding: 20px; background-color: #f8f9fa;">
        <div th:replace="~{fragments/header :: header(${title})}"></div>
        <main style="flex: 1;">
            <th:block th:replace="${content}"></th:block>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<th:block th:replace="${specific_js}"></th:block>
</body>
</html>
