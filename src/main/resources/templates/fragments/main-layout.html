<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, title, specific_head, specific_js)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} + ' - Hệ thống quản lý'"></title>
    <!-- CSS dùng chung -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <!-- Nhúng CSS riêng của từng trang -->
    <th:block th:replace="${specific_head}"></th:block>
</head>
<body>
<div class="wrapper" style="display: flex; min-height: 100vh;">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Vùng nội dung bên phải -->
    <div class="content" style="flex: 1; display: flex; flex-direction: column; padding: 20px; background-color: #f8f9fa;">
        <!-- Header -->
        <div th:replace="~{fragments/header :: header(${title})}"></div>

        <!-- Nội dung động của trang con -->
        <main style="flex: 1;">
            <th:block th:replace="${content}"></th:block>
        </main>

        <!-- Footer mới bổ sung -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<!-- JS dùng chung -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Nhúng JS riêng của từng trang -->
<th:block th:replace="${specific_js}"></th:block>
</body>
</html>
