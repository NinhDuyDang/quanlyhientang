<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/main-layout :: layout(~{:: .setting-content-block}, 'Cài đặt hệ thống', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/setting.css}">
    </th:block>
</head>
<body>

<div class="setting-content-block">
    <div class="mb-3 mt-2">
        <h5 class="fw-semibold text-dark mb-1">Cài đặt thông tin cá nhân</h5>
        <p class="text-muted small">Cập nhật các thông tin liên hệ của bạn hiển thị trên danh mục hệ thống</p>
    </div>

    <div class="card setting-card-custom">
        <form th:action="@{/setting/update}" method="POST" enctype="multipart/form-data">
            <div class="row">

                <div class="col-md-3 text-center border-end pe-md-4 mb-4 mb-md-0">
                    <label class="setting-label d-block mb-3">Ảnh đại diện</label>
                    <img th:src="${avatarUrl}" id="avatarPreview" class="preview-avatar-circle mb-3" alt="Avatar">

                    <div class="mt-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm w-100" onclick="document.getElementById('fileInput').click()">
                            <i class="bi bi-folder-plus me-1"></i> Chọn ảnh từ máy...
                        </button>
                        <input type="file" name="avatarFile" id="fileInput" accept="image/*" class="d-none" onchange="previewSelectedFile(this)">
                    </div>
                </div>

                <div class="col-md-9 ps-md-4">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label setting-label">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" name="name" th:value="${name}" class="form-control setting-input" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label setting-label">Tuổi <span class="text-danger">*</span></label>
                            <input type="number" name="age" th:value="${age}" class="form-control setting-input" min="18" max="100" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label setting-label">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                            <input type="text" name="phone" th:value="${phone}" class="form-control setting-input" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label setting-label">Địa chỉ làm việc</label>
                            <input type="text" name="address" th:value="${address}" class="form-control setting-input">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
                        <button type="button" class="btn btn-light border px-4" style="font-size: 14px; border-radius: 6px;" onclick="location.reload()">Hủy</button>
                        <button type="submit" class="btn btn-primary px-4" style="font-size: 14px; border-radius: 6px; background-color: #0d6efd; border: none;">
                            <i class="bi bi-file-earmark-check me-1"></i> Lưu cập nhật
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>

<script>
    function previewSelectedFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatarPreview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
