<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/main-layout :: layout(~{:: .setting-content-block}, 'Cài đặt hệ thống', ~{:: .page-css}, ~{})}">
<head>
    <th:block class="page-css">
        <link rel="stylesheet" th:href="@{/css/setting.css}">
        <style>
            input[type=number]::-webkit-inner-spin-button,
            input[type=number]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            input[type=number] {
                -moz-appearance: textfield; /* Hỗ trợ Firefox */
            }
        </style>
    </th:block>
</head>
<body>

<div class="setting-content-block">
    <div class="mb-3 mt-2">
        <h5 class="fw-semibold text-dark mb-1">Cài đặt thông tin cá nhân</h5>
    </div>

    <div class="card setting-card-custom">
        <form th:action="@{/profile/update}" method="POST" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="row">
                <div class="col-md-3 text-center border-end pe-md-4">
                    <img th:src="${user.avatarUrl != null ? user.avatarUrl : '/images/default-avatar.png'}"
                         id="avatarPreview" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover;">
                    <div class="mt-3">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('fileInput').click()">Chọn ảnh</button>
                        <input type="file" name="avatarFile" id="fileInput" class="d-none" onchange="previewSelectedFile(this)">
                    </div>
                </div>
                <div class="col-md-9 ps-md-4">
                    <div class="row g-3">
                        <div class="col-md-8"><label class="form-label">Họ và tên</label>
                            <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Tuổi</label>
                            <input type="number" name="age" th:value="${user.age}" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Số điện thoại</label>
                            <input type="text" name="phoneNumber" th:value="${user.phoneNumber}" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Địa chỉ làm việc</label>
                            <input type="text" name="workAddress" th:value="${user.workAddress}" class="form-control"></div>
                    </div>
                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                        <a th:href="@{/profile}" class="btn btn-light border px-4">Hủy</a>
                        <button type="submit" class="btn btn-primary px-4">Lưu cập nhật</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    function previewSelectedFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('avatarPreview').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
